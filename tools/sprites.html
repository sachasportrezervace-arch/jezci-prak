<!doctype html><meta charset="utf-8"><title>Ježkomet – přehled postaviček</title>
<style>body{margin:0;background:#86D8F0;font:600 13px system-ui;color:#2B1638}canvas{display:block}</style>
<canvas id="c" width="1500" height="1000"></canvas>
<script src="../vendor/matter-0.19.0.min.js"></script><script src="../engine.js"></script><script src="../art.js"></script>
<script>
const c=document.getElementById("c").getContext("2d"),{drawCritter,drawHog,drawBlock,TEAM}=ART;
const S=2.6,LW=2.2;
const states=[["klid",{}],["mrk",{blink:1}],["strach",{fear:.9,lookX:1}],["úlek",{startle:1}],["zásah",{hit:1,hurt:.35}],["plácek",{hurt:.35}],["obvaz",{hurt:.6,sad:.3}],["málem KO",{hurt:.9}],["radost",{cheer:1}],["facepalm",{sad:1}],["KO",{ko:true,hurt:1}]];
c.fillStyle="#86D8F0";c.fillRect(0,0,1500,1000);
c.font="600 13px system-ui";
["x","o"].forEach((t,ri)=>states.forEach(([n,o],i)=>{c.save();c.translate(70+i*130,70+ri*125);c.scale(S,S);drawCritter(c,t,LW,{lookX:t==="x"?1:-1,t:1.3,still:false,...o});c.restore();c.fillStyle="#2B1638";c.fillText(n,40+i*130,128+ri*125)}));
["n","k","g","b"].forEach((t,i)=>{c.save();c.translate(80+i*130,360);c.scale(S,S);drawHog(c,"x",LW,t,{t:1});c.restore()});
const ks=[["wP"],["wL"],["wB"],["sB"],["gP"],["gS"]];
ks.forEach(([k],i)=>[0,.3,.6,.9].forEach((d,j)=>{c.save();c.translate(130+i*230,470+j*120);const K=JP.KIND[k];const sc=Math.min(1.4,200/Math.max(K.w,K.h));c.scale(sc,sc);drawBlock(c,k,2.4/sc*1.0,d,i*4+j+2);c.restore()}));
</script>
